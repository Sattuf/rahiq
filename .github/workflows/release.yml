name: Release

# main → images tagged with the commit SHA → staging (migrations first) → smoke → manual approval → production (devops.md §3).
# Rollback: run this workflow with `rollback: true` for an environment, or `infra/scripts/deploy.sh --rollback` on the host.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment: { type: choice, options: [staging, production], default: staging }
      rollback: { type: boolean, default: false }

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' && !inputs.rollback || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/rahiq-api:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: infra/docker/web.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_MEDIA_ORIGIN=${{ vars.MEDIA_ORIGIN }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_API_ORIGIN=${{ vars.API_ORIGIN }}
          tags: ${{ env.REGISTRY }}/rahiq-web:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  staging:
    needs: images
    if: github.event_name != 'workflow_dispatch' || inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd /opt/rahiq && git fetch -q && git checkout -q ${{ github.event.workflow_run.head_sha || github.sha }} && REGISTRY=${{ env.REGISTRY }} infra/scripts/deploy.sh ${{ needs.images.outputs.tag }}
      - name: Smoke
        run: |
          curl -fsS "${{ vars.API_URL }}/health/ready"
          curl -fsS "${{ vars.SITE_URL }}/tr" -o /dev/null

  production:
    needs: [images, staging]
    if: github.event_name != 'workflow_dispatch' || inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production # Required reviewers are configured on this environment: this is the manual approval.
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd /opt/rahiq && git fetch -q && git checkout -q ${{ github.event.workflow_run.head_sha || github.sha }} && REGISTRY=${{ env.REGISTRY }} infra/scripts/deploy.sh ${{ needs.images.outputs.tag }}
      - name: Smoke
        run: curl -fsS "${{ vars.API_URL }}/health/ready"

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd /opt/rahiq && REGISTRY=${{ env.REGISTRY }} infra/scripts/deploy.sh --rollback
